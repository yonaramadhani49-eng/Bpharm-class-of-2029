<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPharm One — Class of 2029</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="toast"></div>

  <!-- Hero / Navigation -->
  <section id="hero" class="page active">
    <div class="hero">
      <h1>BPHARM ONE</h1>
      <p>Class of 2029 · Interactive Memory Wall</p>
    </div>
    <div class="card nav-menu">
      <button data-next="wall">Class Wall</button>
      <button data-next="memories" class="secondary">Memories Gallery</button>
      <button data-next="love" class="secondary">Show Love</button>
      <button data-next="cr" class="secondary">CR Appreciation</button>
      <button data-next="cards" class="secondary">Card Studio</button>
      <button data-next="capsule" class="secondary">Time Capsule</button>
    </div>
  </section>

  <!-- Class Wall -->
  <section id="wall" class="page">
    <h2>Class Wall</h2>
    <div class="card">
      <input type="text" id="name" placeholder="Your name (optional)">
      <textarea id="message" placeholder="Share a thought with BPharm One..."></textarea>
      <label><input type="checkbox" id="anonymousMessage"> Post anonymously</label>
      <button id="postMessage">POST MESSAGE</button>
    </div>
    <div id="wallFeed"></div>
    <button data-next="hero" class="secondary nav-back">← Back Home</button>
  </section>

  <!-- Memories -->
  <section id="memories" class="page">
    <h2>Memories Gallery</h2>
    <button id="addMemory">+ Add Photo Memory</button>
    <input type="file" id="memoryInput" accept="image/*" class="hidden">
    <div id="memoryGallery"></div>
    <button data-next="hero" class="secondary nav-back">← Back Home</button>
  </section>

  <!-- Show Love -->
  <section id="love" class="page">
    <h2>Show Love</h2>
    <div class="card">
      <input type="text" id="heartTarget" placeholder="To someone in BPharm One...">
      <input type="text" id="heartSender" placeholder="Your name (optional)">
      <button id="heartBtn">SEND HEART ❤️</button>
    </div>
    <div id="heartCount"></div>
    <div id="loveFeed"></div>
    <button data-next="hero" class="secondary nav-back">← Back Home</button>
  </section>

  <!-- CR Appreciation -->
  <section id="cr" class="page">
    <h2>Class Representatives</h2>
    <div class="cr-card" data-cr="adina">Madam Adina</div>
    <div class="cr-card" data-cr="julius">Julius</div>
    <div class="cr-card" data-cr="paschal">Paschal</div>
    <div id="crModal" class="hidden">
      <div id="crModalContent"></div>
      <button id="closeCr" class="secondary">Close</button>
    </div>
    <button data-next="hero" class="secondary nav-back">← Back Home</button>
  </section>

  <!-- Card Studio -->
  <section id="cards" class="page">
    <h2>Card Studio</h2>
    <div class="templates">
      <button class="template-btn selected" data-template="APPRECIATION"><small>APPRECIATION</small></button>
      <button class="template-btn" data-template="CONGRATS"><small>CONGRATS</small></button>
    </div>
    <textarea id="cardText" placeholder="Card message..."></textarea>
    <input type="text" id="cardFrom" placeholder="From name...">
    <button id="downloadCard">DOWNLOAD PNG</button>
    <button id="postCard" class="secondary">POST CARD</button>
    <button data-next="hero" class="secondary nav-back">← Back Home</button>
  </section>

  <!-- Time Capsule -->
  <section id="capsule" class="page">
    <h2>2029 Time Capsule</h2>
    <textarea id="capsuleText" placeholder="Write a message to be unsealed in 2029..."></textarea>
    <button id="seal">SEAL MESSAGE 🔒</button>
    <div id="sealed" class="hidden">Message sealed for 2029!</div>
    <button data-next="hero" class="secondary nav-back">← Back Home</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
